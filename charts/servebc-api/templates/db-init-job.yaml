{{- if and .Values.database.initJob.enabled .Values.database.usePostgres }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "common.names.fullname" . }}-db-init
  namespace: {{ include "common.names.namespace" . | quote }}
  labels: {{- include "common.labels.standard" ( dict "customLabels" .Values.commonLabels "context" $ ) | nindent 4 }}
    app.kubernetes.io/component: servebc-api
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-1"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
    {{- if .Values.commonAnnotations }}
    {{- include "common.tplvalues.render" ( dict "value" .Values.commonAnnotations "context" $ ) | nindent 4 }}
    {{- end }}
spec:
  backoffLimit: 3
  template:
    metadata:
      labels: {{- include "common.labels.standard" ( dict "customLabels" .Values.commonLabels "context" $ ) | nindent 8 }}
        app.kubernetes.io/component: servebc-api-db-init
    spec:
      restartPolicy: OnFailure
      {{- include "servebc-api.imagePullSecrets" . | nindent 6 }}
      {{- if .Values.hostAliases }}
      hostAliases: {{- include "common.tplvalues.render" (dict "value" .Values.hostAliases "context" $) | nindent 8 }}
      {{- end }}
      containers:
        - name: db-init
          image: {{ .Values.database.initJob.image }}
          command:
            - sh
            - -c
            - |
              echo "Checking if database '$DB_NAME' exists..."
              EXISTS=$(psql "postgresql://$DB_USERNAME:$DB_PASSWORD@$DB_HOST:$DB_PORT/postgres" -tAc \
                "SELECT 1 FROM pg_database WHERE datname = '$DB_NAME'")
              if [ "$EXISTS" = "1" ]; then
                echo "Database '$DB_NAME' already exists, skipping creation."
              else
                echo "Creating database '$DB_NAME'..."
                psql "postgresql://$DB_USERNAME:$DB_PASSWORD@$DB_HOST:$DB_PORT/postgres" \
                  -c "CREATE DATABASE \"$DB_NAME\" OWNER $DB_USERNAME;"
                echo "Database '$DB_NAME' created."
              fi
          env:
            - name: DB_USERNAME
              valueFrom:
                secretKeyRef:
                  key: DB_USERNAME
                  name: {{ include "common.names.fullname" . }}-db-init
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  key: DB_PASSWORD
                  name: {{ include "common.names.fullname" . }}-db-init
            - name: DB_NAME
              valueFrom:
                secretKeyRef:
                  key: DB_NAME
                  name: {{ include "common.names.fullname" . }}-db-init
            - name: DB_HOST
              valueFrom:
                secretKeyRef:
                  key: DB_HOST
                  name: {{ include "common.names.fullname" . }}-db-init
            - name: DB_PORT
              valueFrom:
                secretKeyRef:
                  key: DB_PORT
                  name: {{ include "common.names.fullname" . }}-db-init
{{- end }}
