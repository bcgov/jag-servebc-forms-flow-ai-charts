apiVersion: {{ include "common.capabilities.deployment.apiVersion" . }}
kind: Deployment
metadata:
  name: {{ include "common.names.fullname" . }}
  namespace: {{ include "common.names.namespace" . | quote }}
  labels: {{- include "common.labels.standard" ( dict "customLabels" .Values.commonLabels "context" $ ) | nindent 4 }}
  {{- if .Values.commonAnnotations }}
  annotations: {{- include "common.tplvalues.render" ( dict "value" .Values.commonAnnotations "context" $ ) | nindent 4 }}
  {{- end }}
spec:
  {{- $podLabels := include "common.tplvalues.merge" ( dict "values" ( list .Values.podLabels .Values.commonLabels ) "context" . ) }}
  selector:
    matchLabels: {{- include "common.labels.matchLabels" ( dict "customLabels" $podLabels "context" $ ) | nindent 6 }}
  replicas: {{ .Values.replicaCount }}
  strategy: {{- include "common.tplvalues.render" (dict "value" .Values.updateStrategy "context" $ ) | nindent 4 }}
  template:
    metadata:
      labels: {{- include "common.labels.standard" ( dict "customLabels" $podLabels "context" $ ) | nindent 8 }}
        app.kubernetes.io/component: servebc-api
      annotations:
        {{- if (include "servebc-api.createConfigmap" .) }}
        checksum/configuration: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        {{- end }}
        {{- if .Values.podAnnotations }}
        {{- include "common.tplvalues.render" (dict "value" .Values.podAnnotations "context" $) | nindent 8 }}
        {{- end }}
    spec:
      serviceAccountName: {{ include "servebc-api.serviceAccountName" . }}
      {{- include "servebc-api.imagePullSecrets" . | nindent 6 }}
      automountServiceAccountToken: {{ .Values.automountServiceAccountToken }}
      {{- if .Values.hostAliases }}
      hostAliases: {{- include "common.tplvalues.render" (dict "value" .Values.hostAliases "context" $) | nindent 8 }}
      {{- end }}
      {{- if .Values.affinity }}
      affinity: {{- include "common.tplvalues.render" (dict "value" .Values.affinity "context" $) | nindent 8 }}
      {{- else }}
      affinity:
        podAffinity: {{- include "common.affinities.pods" (dict "type" .Values.podAffinityPreset "component" "servebc-api" "customLabels" $podLabels "context" $) | nindent 10 }}
        podAntiAffinity: {{- include "common.affinities.pods" (dict "type" .Values.podAntiAffinityPreset "component" "servebc-api" "customLabels" $podLabels "context" $) | nindent 10 }}
        nodeAffinity: {{- include "common.affinities.nodes" (dict "type" .Values.nodeAffinityPreset.type "key" .Values.nodeAffinityPreset.key "values" .Values.nodeAffinityPreset) | nindent 10 }}
      {{- end }}
      {{- if .Values.nodeSelector }}
      nodeSelector: {{- include "common.tplvalues.render" (dict "value" .Values.nodeSelector "context" $) | nindent 8 }}
      {{- end }}
      {{- if .Values.tolerations }}
      tolerations: {{- include "common.tplvalues.render" (dict "value" .Values.tolerations "context" $) | nindent 8 }}
      {{- end }}
      {{- if .Values.schedulerName }}
      schedulerName: {{ .Values.schedulerName }}
      {{- end }}
      {{- if .Values.topologySpreadConstraints }}
      topologySpreadConstraints: {{- include "common.tplvalues.render" (dict "value" .Values.topologySpreadConstraints "context" .) | nindent 8 }}
      {{- end }}
      {{- if .Values.priorityClassName }}
      priorityClassName: {{ .Values.priorityClassName | quote }}
      {{- end }}
      {{- if .Values.podSecurityContext.enabled }}
      securityContext: {{- include "common.compatibility.renderSecurityContext" (dict "secContext" .Values.podSecurityContext "context" $) | nindent 8 }}
      {{- end }}
      containers:
        - name: servebc-api
          image: {{ include "servebc-api.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy | quote }}
          {{- if .Values.containerSecurityContext.enabled }}
          securityContext: {{- include "common.compatibility.renderSecurityContext" (dict "secContext" .Values.containerSecurityContext "context" $) | nindent 12 }}
          {{- end }}
          {{- if .Values.diagnosticMode.enabled }}
          command: {{- include "common.tplvalues.render" (dict "value" .Values.diagnosticMode.command "context" $) | nindent 12 }}
          {{- else if .Values.command }}
          command: {{- include "common.tplvalues.render" (dict "value" .Values.command "context" $) | nindent 12 }}
          {{- end }}
          {{- if .Values.diagnosticMode.enabled }}
          args: {{- include "common.tplvalues.render" (dict "value" .Values.diagnosticMode.args "context" $) | nindent 12 }}
          {{- else if .Values.args }}
          args: {{- include "common.tplvalues.render" (dict "value" .Values.args "context" $) | nindent 12 }}
          {{- end }}
          {{- if .Values.lifecycleHooks }}
          lifecycle: {{- include "common.tplvalues.render" (dict "value" .Values.lifecycleHooks "context" $) | nindent 12 }}
          {{- end }}
          env:
          {{- $secretName := .Values.ExternalDatabase.ExistingSecretName | default (include "common.names.fullname" .) }}
          {{- $configmapName := .Values.ExternalDatabase.ExistingConfigmapName | default (include "common.names.fullname" .) }}
          {{- $servebcSecretName := .Values.formsflow.servebcSecret | default $secretName }}
          {{- $servebcConfigmapName := .Values.formsflow.servebcConfigmap | default $configmapName }}
          - name: DB_USERNAME
            valueFrom:
              secretKeyRef:
                key: {{ .Values.ExternalDatabase.ExistingDatabaseUserNameKey | default "SERVEBC_DB_USER" }}
                name: "{{ $servebcSecretName }}"
          - name: DB_PASSWORD
            valueFrom:
              secretKeyRef:
                key: {{ .Values.ExternalDatabase.ExistingDatabasePasswordKey | default "SERVEBC_DB_PASSWORD" }}
                name: "{{ $servebcSecretName }}"
          - name: DB_NAME
            valueFrom:
              secretKeyRef:
                key: {{ .Values.ExternalDatabase.ExistingDatabaseNameKey | default "SERVEBC_DB_NAME" }}
                name: "{{ $servebcSecretName }}"
          - name: DB_HOST
            valueFrom:
              secretKeyRef:
                key: {{ .Values.ExternalDatabase.ExistingDatabaseHostKey | default "SERVEBC_DB_HOST" }}
                name: "{{ $servebcSecretName }}"
          - name: DB_PORT
            valueFrom:
              configMapKeyRef:
                key: {{ .Values.ExternalDatabase.ExistingDatabasePortKey | default "DB_PORT" }}
                name: "{{ $servebcConfigmapName }}"
          - name: DB_USE_POSTGRES
            valueFrom:
              configMapKeyRef:
                key: DB_USE_POSTGRES
                name: "{{ $servebcConfigmapName }}"
          - name: KEYCLOAK_REALM
            valueFrom:
              configMapKeyRef:
                key: KEYCLOAK_URL_REALM
                name: "{{ .Values.formsflow.configmap }}"
          {{- /* KEYCLOAK_URL alone is missing Keycloak's HTTP relative path (e.g. "/auth")
                 that its realm endpoints actually live under — keycloak-connect needs the
                 full base URL or every token's issuer check fails and it returns a fast,
                 unhelpful 403 "Access denied". Concatenate both configmap keys here since
                 Kubernetes env vars can't reference/combine other configmap values directly. */}}
          {{- $ffConfigMap := lookup "v1" "ConfigMap" .Release.Namespace .Values.formsflow.configmap | default dict }}
          {{- $ffData := get $ffConfigMap "data" | default dict }}
          - name: KEYCLOAK_AUTH_SERVER_URL
            value: {{ printf "%s%s" (get $ffData "KEYCLOAK_URL" | default "") (get $ffData "KEYCLOAK_URL_HTTP_RELATIVE_PATH" | default "") | quote }}
          - name: KEYCLOAK_CLIENT_ID
            valueFrom:
              secretKeyRef:
                key: WEB_CLIENTID
                name: "{{ .Values.formsflow.secret }}"
          - name: API_PORT
            valueFrom:
              configMapKeyRef:
                key: API_PORT
                name: "{{ $configmapName }}"
          - name: CORS_ORIGIN
            valueFrom:
              configMapKeyRef:
                key: CORS_ORIGIN
                name: "{{ $configmapName }}"
          - name: NODE_ENV
            valueFrom:
              configMapKeyRef:
                key: NODE_ENV
                name: "{{ $configmapName }}"
          - name: LOG_LEVEL
            valueFrom:
              configMapKeyRef:
                key: LOG_LEVEL
                name: "{{ $configmapName }}"
          - name: S3_BUCKETNAME
            valueFrom:
              configMapKeyRef:
                key: S3_BUCKETNAME
                name: "{{ $servebcConfigmapName }}"
          - name: S3_HOST
            valueFrom:
              configMapKeyRef:
                key: S3_HOST
                name: "{{ $servebcConfigmapName }}"
          - name: S3_USE_SSL
            valueFrom:
              configMapKeyRef:
                key: S3_USE_SSL
                name: "{{ $servebcConfigmapName }}"
          - name: S3_ACCESS_KEY_ID
            valueFrom:
              secretKeyRef:
                key: SERVEBC_S3_ACCESS_KEY_ID
                name: "{{ $servebcSecretName }}"
          - name: S3_SECRET_ACCESS_KEY
            valueFrom:
              secretKeyRef:
                key: SERVEBC_S3_SECRET_ACCESS_KEY
                name: "{{ $servebcSecretName }}"
          {{- if .Values.extraEnvVars }}
          {{- include "common.tplvalues.render" (dict "value" .Values.extraEnvVars "context" $) | nindent 10 }}
          {{- end }}
          {{- if or .Values.extraEnvVarsCM .Values.extraEnvVarsSecret }}
          envFrom:
            {{- if .Values.extraEnvVarsCM }}
            - configMapRef:
                name: {{ include "common.tplvalues.render" (dict "value" .Values.extraEnvVarsCM "context" $) }}
            {{- end }}
            {{- if .Values.extraEnvVarsSecret }}
            - secretRef:
                name: {{ include "common.tplvalues.render" (dict "value" .Values.extraEnvVarsSecret "context" $) }}
            {{- end }}
          {{- end }}
          ports:
          - name: http
            containerPort: {{ .Values.containerPorts.http }}
            protocol: TCP
          livenessProbe:
            httpGet:
              path: /api/v1/healthcheck
              port: http
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /api/v1/healthcheck
              port: http
            initialDelaySeconds: 15
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
          {{- if .Values.resources }}
          resources: {{- toYaml .Values.resources | nindent 12 }}
          {{- else if ne .Values.resourcesPreset "none" }}
          resources: {{- include "common.resources.preset" (dict "type" .Values.resourcesPreset) | nindent 12 }}
          {{- end }}
          volumeMounts:
          - name: keycloak-config
            mountPath: /api/keycloak.json
            subPath: keycloak.json
            readOnly: true
          {{- if .Values.extraVolumeMounts }}
          {{- include "common.tplvalues.render" (dict "value" .Values.extraVolumeMounts "context" $) | nindent 10 }}
          {{- end }}
          {{- if .Values.sidecars }}
          {{- include "common.tplvalues.render" ( dict "value" .Values.sidecars "context" $) | nindent 8 }}
          {{- end }}
      volumes:
      - name: keycloak-config
        configMap:
          name: {{ include "common.names.fullname" . }}-keycloak
      {{- if .Values.extraVolumes }}
      {{- include "common.tplvalues.render" (dict "value" .Values.extraVolumes "context" $) | nindent 6 }}
      {{- end }}
      restartPolicy: Always
