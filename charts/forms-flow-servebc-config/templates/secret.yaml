apiVersion: v1
kind: Secret
metadata:
  name: forms-flow-servebc
  namespace: {{ .Release.Namespace | quote }}
  labels:
    app.kubernetes.io/name: forms-flow-servebc-config
    app.kubernetes.io/instance: {{ .Release.Name | quote }}
    app.kubernetes.io/managed-by: {{ .Release.Service | quote }}
type: Opaque
stringData:
  EMAIL_KEYCLOAK_CLIENT_ID: {{ .Values.ches.clientId | quote }}
  EMAIL_KEYCLOAK_CLIENT_SECRET: {{ .Values.ches.clientSecret | quote }}
  SERVEBC_DB_USER: {{ .Values.database.username | quote }}
  SERVEBC_DB_PASSWORD: {{ .Values.database.password | quote }}
  SERVEBC_DB_NAME: {{ .Values.database.dbName | quote }}
  SERVEBC_DB_HOST: {{ .Values.database.host | quote }}
  SERVEBC_S3_ACCESS_KEY_ID: {{ .Values.s3.accessKeyId | quote }}
  SERVEBC_S3_SECRET_ACCESS_KEY: {{ .Values.s3.secretAccessKey | quote }}
