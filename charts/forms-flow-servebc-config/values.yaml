## CHES (Common Hosted Email Service) — required inside the forms-flow-bpm container
## to send notification emails.
## @param ches.keycloakUrl Keycloak URL used to obtain a CHES access token
## @param ches.clientId Keycloak client id for CHES (-> Secret)
## @param ches.clientSecret Keycloak client secret for CHES (-> Secret)
## @param ches.serviceUrl CHES email service base URL
##
ches:
  keycloakUrl: ""
  clientId: ""
  clientSecret: ""
  serviceUrl: ""

## S3 / object storage — required inside the servebc-api container for document storage.
## @param s3.bucketName S3 bucket name
## @param s3.host S3-compatible host/endpoint
## @param s3.accessKeyId S3 access key id (-> Secret)
## @param s3.secretAccessKey S3 secret access key (-> Secret)
## @param s3.useSsl Whether servebc-api should speak HTTPS to s3.host (set "false" for a plain-HTTP local endpoint like MinIO)
##
s3:
  bucketName: ""
  host: ""
  accessKeyId: ""
  secretAccessKey: ""
  useSsl: "true"

## servebc Postgres database — required inside the servebc-api container.
## NOTE: servebc-api's own chart still keeps a copy of these under its `database.*` values,
## used only by its one-time db-init Job (a pre-install/pre-upgrade hook that cannot depend on
## this chart's Secret existing yet). Keep both copies in sync when changing credentials.
## @param database.username Postgres username
## @param database.password Postgres password (-> Secret)
## @param database.dbName Database name (-> Secret)
## @param database.host Postgres host (service name)
## @param database.port Postgres port
## @param database.usePostgres Whether servebc-api should use Postgres
##
database:
  username: "postgres"
  password: "postgres"
  dbName: "servebc"
  host: "forms-flow-ai-postgresql-ha-pgpool"
  port: 5432
  usePostgres: true

## Misc forms-flow-bpm settings that travel alongside the ServeBC integration.
## @param bpm.timezone TZ env var for the forms-flow-bpm container
##
bpm:
  timezone: "America/Vancouver"

## Where servebc-api can be reached.
## @param servebc.internalUrl Cluster-internal URL (server-to-server, used by forms-flow-bpm)
## @param servebc.externalUrl Ingress URL (browser-facing, used by forms-flow-web's customApiUrl)
##
servebc:
  internalUrl: "http://servebc-api:3003"
  externalUrl: "https://servebc-api-formsflow.127.0.0.1.nip.io"

## @param web.customThemeUrl Custom theme URL, also consumed by forms-flow-web
##
web:
  customThemeUrl: ""
