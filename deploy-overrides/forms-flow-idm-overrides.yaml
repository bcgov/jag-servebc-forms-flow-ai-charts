# OpenShift SCC compatibility override for forms-flow-idm, all environments (a60371-dev/test/prod).
# The chart's own values.yaml hardcodes securityContext.runAsUser: 1001 on the custom
# "formsflow-themes" initContainer, which OpenShift's restricted SCC rejects (namespace's
# allowed UID range doesn't include 1001). The chart's main container already leaves
# containerSecurityContext/podSecurityContext disabled (letting OpenShift auto-assign a UID) --
# this initContainer just needs to follow the same pattern. Re-specifying the full
# initContainers entry here (not just the securityContext field) because Helm --set/--set-json
# on a single field of an existing array element wipes the rest of that element's fields.
keycloak:
  initContainers:
    - name: formsflow-themes
      image: formsflow/keycloak-customizations:v7.3.0
      imagePullPolicy: Always
      command: ["/bin/sh","-c"]
      args:
      - "mkdir -p /opt/bitnami/keycloak/themes /opt/bitnami/keycloak/providers /opt/bitnami/keycloak/import && \
         cp -rf /custom/themes/* /opt/bitnami/keycloak/themes && \
         cp -rf /custom/imports/* /opt/bitnami/keycloak/import && \
         cp -rf /custom/providers/* /opt/bitnami/keycloak/providers"
      volumeMounts:
      - mountPath: /opt/bitnami/keycloak
        name: empty-dir
      - mountPath: /opt/bitnami/keycloak/providers
        name: empty-dir
        subPath: app-providers-dir
